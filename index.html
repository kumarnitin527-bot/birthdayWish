<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Floating Hearts Background -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Landing Section -->
    <section class="landing" id="landing">
        <div class="envelope" id="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-body">
                <p>Click to open</p>
            </div>
        </div>
    </section>

    <!-- Main Birthday Section -->
    <section class="birthday-section" id="birthdaySection">
        <div class="confetti-container" id="confettiContainer"></div>

        <div class="content">
            <h1 class="title">Happy Birthday!</h1>
            <h2 class="subtitle">To the most amazing person in my life</h2>

            <div class="cake-container">
                <div class="cake">
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                    <div class="layer layer-top"></div>
                    <div class="layer layer-middle"></div>
                    <div class="layer layer-bottom"></div>
                </div>
            </div>

            <div class="message-box">
                <p class="message" id="message"></p>
            </div>

            <div class="wishes">
                <button class="wish-btn" id="wishBtn">Make a Wish</button>
            </div>

            <div class="photo-frame">
                <div class="frame-border">
                    <p class="frame-text">Our Beautiful Memories</p>
                    <p class="frame-subtext">Place your favorite photo here</p>
                </div>
            </div>

            <div class="footer-message">
                <p>With all my love, forever and always</p>
                <span class="heart-icon">&#10084;</span>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
